# Quick start:
#   docker compose up --build
# Then open http://localhost:5173 (frontend) - it talks to the backend at
# http://localhost:8080/api, which talks to the mongo container below.
#
# For day-to-day development with hot reload, it's usually nicer to run
# only Mongo through Docker and run the backend/frontend natively - see
# the root README.md "Local development (recommended)" section.

services:
  mongo:
    image: mongo:7
    container_name: careertrack-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: careertrack-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/careertrack
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-ZmFrZS1kZXYtb25seS1zZWNyZXQta2V5LWRvLW5vdC11c2UtaW4tcHJvZC0xMjM0NTY3ODkwCg==}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: careertrack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo-data:
